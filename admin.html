<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel ADM · Rotina do Personal</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<style>
:root{--bg:#0f1115;--card:#171a20;--txt:#ece7dc;--mut:#a9a395;--gold:#d4a24c;--line:#2a2e36;--ok:#2EBD4E;--warn:#f0b429;--bad:#E53935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.logo{font-size:20px;font-weight:800;margin:0}.logo b{color:var(--gold)}
h1{font-size:22px;margin:6px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.kb{cursor:pointer;text-align:left;font:inherit;color:inherit}.kb.on{border-color:#d4a24c!important;box-shadow:0 0 0 2px #d4a24c}.kb b{display:block}.vt{margin:6px 0 8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mut);font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bar input,.bar select{flex:1;min-width:150px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1a1d23;color:#fff;font-size:15px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--gold);color:#111;font-size:14px}
.btn.g{background:#2a2e36;color:var(--txt)}
.list{display:grid;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.it .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.it .nm{font-weight:800;font-size:16px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.ok{background:rgba(46,189,78,.15);color:var(--ok)}.tag.warn{background:rgba(240,180,41,.15);color:var(--warn)}.tag.bad{background:rgba(229,57,53,.15);color:#ff8a80}
.mut{color:var(--mut);font-size:13.5px}
.it a{color:var(--gold);text-decoration:none}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.msg{color:var(--mut);padding:30px 0;text-align:center}
.login{max-width:340px;margin:80px auto;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;display:grid;gap:10px}
.box h2{font-size:16px;margin:0}.box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box select,.box input{padding:10px;border-radius:10px;border:1px solid var(--line);background:#1a1d23;color:#fff;font-size:15px}
.lnk{background:#0b0d10;border:1px dashed var(--gold);border-radius:10px;padding:10px;word-break:break-all;font-size:13.5px}
.btn.wa{background:#25D366;color:#fff}.btn.sm{padding:7px 10px;font-size:12.5px}.btn.red{background:#3a1c1c;color:#ff8a80}
.acs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ac{font-size:13.5px;font-weight:700}.ac.ok{color:var(--ok)}.ac.warn{color:var(--warn)}.ac.bad{color:#ff8a80}
details summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:14px}
.cv{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:13.5px;align-items:center}
</style>
</head>
<body>
