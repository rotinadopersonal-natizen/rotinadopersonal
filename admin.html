<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel ADM · Rotina do Personal</title>
<link rel="icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a20;--txt:#ece7dc;--mut:#a9a395;--gold:#d4a24c;--line:#2a2e36;--ok:#2EBD4E;--warn:#f0b429;--bad:#E53935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.logo{font-size:20px;font-weight:800;margin:0}.logo b{color:var(--gold)}
h1{font-size:22px;margin:6px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mut);font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bar input,.bar select{flex:1;min-width:150px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1a1d23;color:#fff;font-size:15px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--gold);color:#111;font-size:14px}
.btn.g{background:#2a2e36;color:var(--txt)}
.list{display:grid;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.it .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.it .nm{font-weight:800;font-size:16px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.ok{background:rgba(46,189,78,.15);color:var(--ok)}.tag.warn{background:rgba(240,180,41,.15);color:var(--warn)}.tag.bad{background:rgba(229,57,53,.15);color:#ff8a80}
.mut{color:var(--mut);font-size:13.5px}
.it a{color:var(--gold);text-decoration:none}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.msg{color:var(--mut);padding:30px 0;text-align:center}
.login{max-width:340px;margin:80px auto;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;display:grid;gap:10px}
.box h2{font-size:16px;margin:0}.box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box select,.box input{padding:10px;border-radius:10px;border:1px solid var(--line);background:#1a1d23;color:#fff;font-size:15px}
.lnk{background:#0b0d10;border:1px dashed var(--gold);border-radius:10px;padding:10px;word-break:break-all;font-size:13.5px}
.btn.wa{background:#25D366;color:#fff}.btn.sm{padding:7px 10px;font-size:12.5px}.btn.red{background:#3a1c1c;color:#ff8a80}
.acs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ac{font-size:13.5px;font-weight:700}.ac.ok{color:var(--ok)}.ac.warn{color:var(--warn)}.ac.bad{color:#ff8a80}
details summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:14px}
.cv{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:13.5px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <p class="logo">Rotina do <b>Personal</b></p>
  <h1>Painel ADM</h1>
  <div id="app"><p class="msg">Carregando…</p></div>
</div>
<script>
(function(){
  var ADMIN="0HtqKqXRaLN9hQ34QlPmG4nB2fi1";
  var app=document.getElementById("app");
  var esc=function(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  if(!window.RP_FIREBASE||!window.firebase){ app.innerHTML='<p class="msg">Sistema em manutenção.</p>'; return; }
  firebase.initializeApp(window.RP_FIREBASE); var auth=firebase.auth(), fs=firebase.firestore();
  var dias=function(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/864e5); };
  var dt=function(iso){ if(!iso) return "—"; var d=new Date(iso); return d.toLocaleDateString("pt-BR"); };
  var quando=function(iso){ var n=dias(iso); if(n==null) return "nunca registrado"; if(n<=0) return "hoje"; if(n===1) return "ontem"; return "há "+n+" dias"; };
  var status=function(c){ var n=dias(c.ultimoAcesso); if(n==null) return ["bad","Sem acesso registrado"]; if(n<=7) return ["ok","Ativo"]; if(n<=21) return ["warn","Esfriando"]; return ["bad","Parado"]; };
  var wa=function(t){ var d=String(t||"").replace(/\D/g,""); if(!d) return ""; if(d.length<=11) d="55"+d; return "https://wa.me/"+d; };
  var ig=function(h){ h=String(h||"").trim(); if(!h) return ""; if(/^https?:/.test(h)) return h; return "https://instagram.com/"+h.replace(/^@/,""); };
  var L=[], AC={}, CV=[], filtro="", ordem="acesso", novoLink=null;
  var tsMs=function(v){ if(v==null) return null; if(v.toMillis) return v.toMillis(); if(v.seconds!=null) return v.seconds*1000; var t=Date.parse(v); return isNaN(t)?null:t; };
  var dBR=function(ms){ return new Date(ms).toLocaleDateString("pt-BR"); };
  var acInfo=function(uid){ if(uid===ADMIN) return ["ok","Administrador"]; var a=AC[uid]; if(!a) return ["warn","Aguardando liberação"]; if(a.status==="bloqueado") return ["bad","Bloqueado"];
    var v=tsMs(a.validoAte); if(v==null) return ["ok","Liberado · sem prazo"]; if(v<Date.now()) return ["bad","Venceu em "+dBR(v)]; var d=Math.ceil((v-Date.now())/864e5); return [d<=7?"warn":"ok","Liberado até "+dBR(v)+" ("+d+" dia"+(d>1?"s":"")+")"]; };
  var pend=function(c){ var i=acInfo(c.uid); return i[1]==="Aguardando liberação"; };
  function liberar(uid,dias){ var a=AC[uid]||{}; var cur=tsMs(a.validoAte); var base=(a.status==="liberado"&&cur&&cur>Date.now())? cur : Date.now();
    var val= dias? firebase.firestore.Timestamp.fromMillis(base+dias*864e5) : null;
    return fs.doc("acessos/"+uid).set({status:"liberado",validoAte:val,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }
  function codigo(){ var a="abcdefghjkmnpqrstuvwxyz23456789", r=""; var b=new Uint8Array(8); crypto.getRandomValues(b); for(var i=0;i<8;i++) r+=a[b[i]%a.length]; return r; }
  var linkDe=function(cod){ return location.origin+location.pathname.replace(/admin\.html$/,"")+"?convite="+cod; };
  var waTxt=function(cod,dias){ return "Olá! Liberei seu acesso ao *Rotina do Personal*, o sistema de treinos, presença e financeiro que eu uso com meus alunos."+(+dias?" Você tem "+dias+" dias para usar.":"")+"\n\nCrie sua conta por este link:\n"+linkDe(cod); };
  function render(){
    var q=filtro.toLowerCase();
    var R=L.filter(function(c){ return !q||[c.nome,c.email,c.telefone,(c.redes||{}).instagram].join(" ").toLowerCase().indexOf(q)>=0; });
    R.sort(function(a,b){ if(ordem==="pend") return (pend(b)?1:0)-(pend(a)?1:0)||String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")); if(ordem==="nome") return String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR"); if(ordem==="cadastro") return String(b.criadoEm||"").localeCompare(String(a.criadoEm||"")); return String(b.ultimoAcesso||"").localeCompare(String(a.ultimoAcesso||"")); });
    var at=L.filter(function(c){ return status(c)[0]==="ok"; }).length;
    var nov=L.filter(function(c){ var n=dias(c.criadoEm); return n!=null&&n<=30; }).length;
    var al=L.reduce(function(s,c){ return s+(+c.nAlunos||0); },0);
    var np=L.filter(pend).length, cvl=CV.filter(function(c){ return !c.usado; });
    app.innerHTML='<div class="kpis"><div class="kpi"><b>'+L.length+'</b><span>Personais cadastrados</span></div><div class="kpi"><b>'+at+'</b><span>Ativos (últimos 7 dias)</span></div><div class="kpi"><b>'+nov+'</b><span>Novos (30 dias)</span></div><div class="kpi"><b>'+al+'</b><span>Alunos cadastrados no total</span></div><div class="kpi"><b>'+np+'</b><span>Aguardando liberação</span></div></div>'+
      '<div class="box"><h2>✉️ Criar convite</h2><div class="row"><select id="cvD"><option value="7">7 dias</option><option value="15">15 dias</option><option value="30" selected>30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option><option value="180">6 meses</option><option value="365">1 ano</option><option value="0">Sem prazo</option></select><input id="cvN" placeholder="Para quem (opcional)" style="flex:1;min-width:140px"><button class="btn" id="cvGo">Criar convite</button></div>'+
        (novoLink?'<div class="lnk">'+esc(linkDe(novoLink.c))+'</div><div class="row"><button class="btn g" id="cvCp">Copiar link</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(waTxt(novoLink.c,novoLink.d))+'" style="text-decoration:none">Enviar no WhatsApp</a></div>':'')+
        '<p class="mut" style="margin:0">Cada link vale para <b>uma</b> pessoa. Quem entrar por ele já fica liberado pelo prazo escolhido.</p>'+
        (CV.length?'<details><summary>Convites ('+cvl.length+' disponíveis, '+(CV.length-cvl.length)+' usados)</summary>'+CV.slice().sort(function(a,b){ return (tsMs(b.criadoEm)||0)-(tsMs(a.criadoEm)||0); }).map(function(c){ var u=c.usado? (L.find(function(x){ return x.uid===c.usadoPor; })||{}).nome||"alguém" : "";
          return '<div class="cv"><span>'+(c.nome?'<b>'+esc(c.nome)+'</b> · ':'')+(+c.dias?c.dias+' dias':'sem prazo')+' · '+(c.usado?'<span class="ac ok">usado por '+esc(u)+'</span>':'<span class="ac warn">disponível</span>')+'</span>'+(c.usado?'':'<span><button class="btn g sm" data-cvcp="'+esc(c.id)+'">Copiar</button> <button class="btn red sm" data-cvdel="'+esc(c.id)+'">Apagar</button></span>')+'</div>'; }).join("")+'</details>':'')+
      '</div>'+
      '<div class="bar"><input id="q" placeholder="Buscar nome, e-mail, telefone…" value="'+esc(filtro)+'"><select id="o"><option value="acesso">Último acesso</option><option value="cadastro">Mais recentes</option><option value="nome">Nome A–Z</option><option value="pend">Aguardando liberação</option></select><button class="btn g" id="cp">Copiar lista</button><button class="btn g" id="out">Sair</button></div>'+
      '<div class="list">'+(R.length? R.map(function(c){ var st=status(c), r=c.redes||{}, w=wa(c.telefone), i=ig(r.instagram);
        return '<div class="it"><div class="top"><span class="nm">'+esc(c.nome||"(sem nome)")+'</span><span class="tag '+st[0]+'">'+st[1]+'</span></div>'+
          '<div class="mut">'+esc(c.email||"")+(c.emailContato?' · contato: '+esc(c.emailContato):'')+'</div>'+
          '<div class="mut">Cadastro: '+dt(c.criadoEm)+' · Último acesso: '+quando(c.ultimoAcesso)+(c.nAlunos!=null?' · '+c.nAlunos+' aluno(s)':'')+'</div>'+
          '<div class="ac '+acInfo(c.uid)[0]+'">🔑 '+esc(acInfo(c.uid)[1])+'</div>'+(c.uid===ADMIN?'':'<div class="acs"><button class="btn sm" data-lib="'+c.uid+'|30">+30 dias</button><button class="btn sm" data-lib="'+c.uid+'|90">+90 dias</button><button class="btn sm" data-lib="'+c.uid+'|365">+1 ano</button><button class="btn g sm" data-lib="'+c.uid+'|0">Sem prazo</button>'+((AC[c.uid]||{}).status==="bloqueado"?'':'<button class="btn red sm" data-blq="'+c.uid+'">Bloquear</button>')+'</div>')+
          '<div class="links">'+(w?'<a href="'+w+'" target="_blank" rel="noopener">💬 '+esc(c.telefone)+'</a>':'')+(i?'<a href="'+esc(i)+'" target="_blank" rel="noopener">📷 '+esc(r.instagram)+'</a>':'')+(r.tiktok?'<span class="mut">TikTok: '+esc(r.tiktok)+'</span>':'')+(r.facebook?'<span class="mut">Facebook: '+esc(r.facebook)+'</span>':'')+(r.site?'<span class="mut">'+esc(r.site)+'</span>':'')+'</div></div>'; }).join("") : '<p class="msg">Nenhum cadastro encontrado.</p>')+'</div>';
    document.getElementById("o").value=ordem;
    document.getElementById("cvGo").onclick=function(){ var d=+document.getElementById("cvD").value, n=document.getElementById("cvN").value.trim(), c=codigo(), b=this; b.disabled=true;
      fs.doc("convites/"+c).set({dias:d,nome:n,usado:false,criadoEm:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){ novoLink={c:c,d:d}; render(); }).catch(function(e){ alert("Não criou o convite ("+((e&&e.code)||"erro")+"). Confira se as regras novas foram publicadas."); b.disabled=false; }); };
    var cp=function(t,b){ (navigator.clipboard? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent="Copiado ✓"; }).catch(function(){ prompt("Copie:",t); }); };
    var cc=document.getElementById("cvCp"); if(cc) cc.onclick=function(){ cp(linkDe(novoLink.c),this); };
    app.querySelectorAll("[data-cvcp]").forEach(function(b){ b.onclick=function(){ var c=CV.find(function(x){ return x.id===b.dataset.cvcp; }); cp(waTxt(c.id,c.dias),b); }; });
    app.querySelectorAll("[data-cvdel]").forEach(function(b){ b.onclick=function(){ if(b.dataset.ok){ fs.doc("convites/"+b.dataset.cvdel).delete(); } else { b.dataset.ok=1; b.textContent="Confirmar?"; } }; });
    app.querySelectorAll("[data-lib]").forEach(function(b){ b.onclick=function(){ var p=b.dataset.lib.split("|"); b.disabled=true; liberar(p[0],+p[1]).catch(function(e){ alert("Não liberou ("+((e&&e.code)||"erro")+")."); b.disabled=false; }); }; });
    app.querySelectorAll("[data-blq]").forEach(function(b){ b.onclick=function(){ if(!b.dataset.ok){ b.dataset.ok=1; b.textContent="Confirmar bloqueio?"; return; } fs.doc("acessos/"+b.dataset.blq).set({status:"bloqueado",atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}); }; });
    document.getElementById("q").oninput=function(){ filtro=this.value; var p=this.selectionStart; render(); var e=document.getElementById("q"); e.focus(); e.setSelectionRange(p,p); };
    document.getElementById("o").onchange=function(){ ordem=this.value; render(); };
    document.getElementById("out").onclick=function(){ auth.signOut().then(function(){ location.href="./"; }); };
    document.getElementById("cp").onclick=function(){ var t=R.map(function(c){ return [c.nome,c.telefone,c.email,(c.redes||{}).instagram||"",dt(c.criadoEm),quando(c.ultimoAcesso)].join(" | "); }).join("\n"); var b=this;
      (navigator.clipboard? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent="Copiado ✓"; setTimeout(function(){ b.textContent="Copiar lista"; },1500); }).catch(function(){ prompt("Copie a lista:",t); }); };
  }
  auth.onAuthStateChanged(function(u){
    if(!u){ app.innerHTML='<div class="login"><p class="mut">Entre primeiro no sistema com a conta de administrador.</p><a class="btn" href="./" style="display:inline-block;text-decoration:none">Ir para o login</a></div>'; return; }
    if(u.uid!==ADMIN){ app.innerHTML='<p class="msg">Esta página é só para o administrador.</p>'; return; }
    fs.collection("acessos").onSnapshot(function(qs){ AC={}; qs.docs.forEach(function(d){ AC[d.id]=d.data(); }); if(L.length) render(); },function(){});
    fs.collection("convites").onSnapshot(function(qs){ CV=qs.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); if(L.length) render(); },function(){});
    fs.collection("cadastros").onSnapshot(function(qs){ L=qs.docs.map(function(d){ return Object.assign({uid:d.id},d.data()); }); render(); },
      function(e){ app.innerHTML='<p class="msg">Sem permissão para ler os cadastros. Confira se as regras novas do Firestore foram publicadas.</p>'; });
  });
})();
</script>
</body>
</html>
